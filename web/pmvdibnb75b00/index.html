<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点金手 · 点击金币</title>
    
<meta name="viewport" content="width=device-width, initial-scale=1"><style data-src="style.css">
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 0%, #1c2b4a 0%, #0b1020 60%, #05070d 100%);
    min-height: 100vh;
    color: #eaf0ff;
    display: flex;
    justify-content: center;
    padding: 12px;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.35), transparent),
        radial-gradient(2px 2px at 70% 15%, rgba(255,255,255,0.25), transparent),
        radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 40% 80%, rgba(255,255,255,0.2), transparent);
    background-size: 100% 100%;
    pointer-events: none;
    z-index: 0;
    animation: twinkle 6s ease-in-out infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.4; }
    to { opacity: 1; }
}

.game-container {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    z-index: 1;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 14px 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}

.coin-counter {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 26px;
    font-weight: 700;
    color: #ffd75e;
    text-shadow: 0 0 14px rgba(255,215,94,0.55);
}

.coin-icon {
    font-size: 24px;
    display: inline-block;
    animation: coinSpin 3s linear infinite;
}

@keyframes coinSpin {
    0%, 70% { transform: rotateY(0); }
    100% { transform: rotateY(360deg); }
}

.cps-display {
    font-size: 13px;
    color: #8fa3c8;
    background: rgba(0,0,0,0.3);
    padding: 6px 12px;
    border-radius: 999px;
}

#cpsDisplay {
    color: #6ef2b8;
    font-weight: 700;
}

.tap-area {
    position: relative;
    background: linear-gradient(160deg, rgba(255,215,94,0.1), rgba(120,90,255,0.08));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 26px;
    padding: 34px 16px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    overflow: hidden;
    box-shadow: inset 0 0 60px rgba(120,90,255,0.12), 0 10px 30px rgba(0,0,0,0.4);
}

.big-coin {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff4c2, #ffd75e 40%, #e0a81f 72%, #a8750b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow:
        0 0 0 8px rgba(255,215,94,0.12),
        0 0 40px rgba(255,200,50,0.45),
        0 18px 34px rgba(0,0,0,0.5);
    transition: transform 0.08s ease, box-shadow 0.2s ease;
    position: relative;
}

.big-coin::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 3px dashed rgba(255,255,255,0.35);
    pointer-events: none;
}

.big-coin:active,
.big-coin.pressed {
    transform: scale(0.93);
    box-shadow:
        0 0 0 4px rgba(255,215,94,0.2),
        0 0 60px rgba(255,210,60,0.8),
        0 8px 18px rgba(0,0,0,0.5);
}

.coin-face {
    font-size: 82px;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    pointer-events: none;
}

.tap-hint {
    font-size: 14px;
    color: #9fb2d6;
    letter-spacing: 1px;
    pointer-events: none;
}

.upgrades {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.upgrade-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 12px 14px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
}

.upgrade-card:active {
    transform: scale(0.98);
}

.upgrade-card.affordable {
    border-color: rgba(110,242,184,0.5);
    background: linear-gradient(135deg, rgba(110,242,184,0.14), rgba(255,255,255,0.03));
}

.upgrade-card.affordable .upgrade-cost {
    color: #6ef2b8;
    text-shadow: 0 0 10px rgba(110,242,184,0.6);
}

.upgrade-card.locked {
    opacity: 0.55;
}

.upgrade-card.maxed {
    opacity: 0.9;
    border-color: rgba(255,215,94,0.6);
}

.upgrade-emoji {
    font-size: 28px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    flex-shrink: 0;
}

.upgrade-info {
    flex: 1;
    min-width: 0;
}

.upgrade-name {
    font-size: 15px;
    font-weight: 700;
    color: #eaf0ff;
}

.upgrade-desc {
    font-size: 12px;
    color: #8fa3c8;
    margin-top: 2px;
}

.upgrade-cost {
    font-size: 14px;
    font-weight: 700;
    color: #c9d6f0;
    white-space: nowrap;
    transition: color 0.2s ease;
}

.reset-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    color: #a9bbe0;
    font-size: 14px;
    padding: 12px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
    font-family: inherit;
}

.reset-btn:active {
    background: rgba(255,90,90,0.25);
    color: #ffb3b3;
    border-color: rgba(255,90,90,0.4);
}

#particleContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    overflow: hidden;
}

.float-particle {
    position: absolute;
    font-size: 18px;
    font-weight: 800;
    color: #ffd75e;
    text-shadow: 0 0 10px rgba(255,215,94,0.8);
    animation: floatUp 0.9s ease-out forwards;
    will-change: transform, opacity;
    white-space: nowrap;
}

@keyframes floatUp {
    0% {
        transform: translate(-50%, 0) scale(0.7);
        opacity: 0;
    }
    20% {
        opacity: 1;
        transform: translate(-50%, -14px) scale(1.15);
    }
    100% {
        transform: translate(-50%, -90px) scale(0.9);
        opacity: 0;
    }
}

.spark {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff6c0, #ffca28);
    box-shadow: 0 0 12px rgba(255,210,60,0.9);
    animation: sparkFly 0.6s ease-out forwards;
    will-change: transform, opacity;
}

@keyframes sparkFly {
    0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }
    100% {
        opacity: 0;
    }
}

.shake {
    animation: shakeAnim 0.35s ease;
}

@keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
}

.pop {
    animation: popAnim 0.25s ease;
}

@keyframes popAnim {
    0% { transform: scale(1); }
    50% { transform: scale(1.14); }
    100% { transform: scale(1); }
}

</style>
</head>
<body>
    <div class="game-container">
        <header>
            <div class="coin-counter">
                <span class="coin-icon">🪙</span>
                <span id="coinDisplay">0</span>
            </div>
            <div class="cps-display">每秒 <span id="cpsDisplay">0</span></div>
        </header>

        <main class="tap-area" id="tapArea">
            <div class="big-coin" id="bigCoin">
                <span class="coin-face">💰</span>
            </div>
            <div class="tap-hint">点击金币赚取</div>
        </main>

        <section class="upgrades">
            <div class="upgrade-card" id="upgradeClick">
                <div class="upgrade-emoji">👆</div>
                <div class="upgrade-info">
                    <div class="upgrade-name">强化点击</div>
                    <div class="upgrade-desc">每次点击收益提升</div>
                </div>
                <div class="upgrade-cost" id="clickCost">10 🪙</div>
            </div>
            <div class="upgrade-card" id="upgradeAuto">
                <div class="upgrade-emoji">⚙️</div>
                <div class="upgrade-info">
                    <div class="upgrade-name">自动挖矿</div>
                    <div class="upgrade-desc">每秒自动产出</div>
                </div>
                <div class="upgrade-cost" id="autoCost">50 🪙</div>
            </div>
            <div class="upgrade-card" id="upgradeCombo">
                <div class="upgrade-emoji">🔥</div>
                <div class="upgrade-info">
                    <div class="upgrade-name">连击加成</div>
                    <div class="upgrade-desc">点击收益翻倍</div>
                </div>
                <div class="upgrade-cost" id="comboCost">200 🪙</div>
            </div>
        </section>

        <button class="reset-btn" id="resetBtn">重新开始</button>
    </div>

    <div id="particleContainer"></div>

    
<script data-src="main.js">
(function () {
    "use strict";

    /* ---------- 游戏状态 ---------- */
    var state = {
        coins: 0,
        clickLevel: 1,      // 每次点击收益 = clickLevel
        autoLevel: 0,       // 每秒自动收益 = autoLevel
        comboLevel: 0,      // 连击加成等级，每级让点击收益翻倍
        totalTaps: 0
    };

    /* ---------- 升级价格 ---------- */
    var BASE_CLICK_COST = 10;
    var BASE_AUTO_COST = 50;
    var BASE_COMBO_COST = 200;
    var COMBO_MAX = 3;

    function clickCost() {
        return Math.floor(BASE_CLICK_COST * Math.pow(1.55, state.clickLevel - 1));
    }
    function autoCost() {
        return Math.floor(BASE_AUTO_COST * Math.pow(1.65, state.autoLevel));
    }
    function comboCost() {
        return Math.floor(BASE_COMBO_COST * Math.pow(2.4, state.comboLevel));
    }

    /* ---------- 收益计算 ---------- */
    function clickValue() {
        var base = state.clickLevel;
        var mult = Math.pow(2, state.comboLevel);
        return base * mult;
    }
    function cps() {
        return state.autoLevel;
    }

    /* ---------- DOM 引用 ---------- */
    var coinDisplay = document.getElementById("coinDisplay");
    var cpsDisplay = document.getElementById("cpsDisplay");
    var bigCoin = document.getElementById("bigCoin");
    var tapArea = document.getElementById("tapArea");
    var particleContainer = document.getElementById("particleContainer");

    var upgradeClick = document.getElementById("upgradeClick");
    var upgradeAuto = document.getElementById("upgradeAuto");
    var upgradeCombo = document.getElementById("upgradeCombo");
    var clickCostEl = document.getElementById("clickCost");
    var autoCostEl = document.getElementById("autoCost");
    var comboCostEl = document.getElementById("comboCost");
    var resetBtn = document.getElementById("resetBtn");

    /* ---------- 数字格式化 ---------- */
    function fmt(n) {
        n = Math.floor(n);
        if (n < 1000) return String(n);
        if (n < 1e6) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
        if (n < 1e9) return (n / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M";
        return (n / 1e9).toFixed(2).replace(/\.?0+$/, "") + "B";
    }

    /* ---------- 渲染 ---------- */
    function render() {
        coinDisplay.textContent = fmt(state.coins);
        cpsDisplay.textContent = fmt(cps());

        clickCostEl.textContent = fmt(clickCost()) + " 🪙";
        autoCostEl.textContent = fmt(autoCost()) + " 🪙";
        comboCostEl.textContent = state.comboLevel >= COMBO_MAX
            ? "已满级"
            : fmt(comboCost()) + " 🪙";

        // 卡片状态
        upgradeClick.classList.toggle("affordable", state.coins >= clickCost());
        upgradeAuto.classList.toggle("affordable", state.coins >= autoCost());

        var comboMaxed = state.comboLevel >= COMBO_MAX;
        upgradeCombo.classList.toggle("maxed", comboMaxed);
        upgradeCombo.classList.toggle("affordable", !comboMaxed && state.coins >= comboCost());

        // 描述文字动态更新
        document.querySelector("#upgradeClick .upgrade-desc").textContent =
            "每次点击 +" + fmt(clickValue()) + " 金币";
        document.querySelector("#upgradeAuto .upgrade-desc").textContent =
            "每秒 +" + fmt(state.autoLevel) + " 金币";
        document.querySelector("#upgradeCombo .upgrade-desc").textContent =
            comboMaxed
                ? "点击收益 x" + Math.pow(2, state.comboLevel) + "（已满）"
                : "点击收益 x" + Math.pow(2, state.comboLevel + 1);
    }

    /* ---------- 粒子反馈 ---------- */
    function spawnFloatText(x, y, text) {
        var el = document.createElement("div");
        el.className = "float-particle";
        el.textContent = text;
        el.style.left = x + "px";
        el.style.top = y + "px";
        particleContainer.appendChild(el);
        setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 950);
    }

    function spawnSparks(x, y) {
        var count = 7;
        for (var i = 0; i < count; i++) {
            var el = document.createElement("div");
            el.className = "spark";
            el.style.left = x + "px";
            el.style.top = y + "px";
            var angle = (Math.PI * 2 * i) / count + Math.random() * 0.6;
            var dist = 34 + Math.random() * 40;
            var dx = Math.cos(angle) * dist;
            var dy = Math.sin(angle) * dist;
            el.style.setProperty("--dx", dx + "px");
            el.style.setProperty("--dy", dy + "px");
            // 使用内联动画 keyframes 不便于变量，这里改用 transition 方式
            el.animate(
                [
                    { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
                    { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(0.2)", opacity: 0 }
                ],
                { duration: 550 + Math.random() * 200, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)" }
            );
            particleContainer.appendChild(el);
            (function (node) {
                setTimeout(function () {
                    if (node.parentNode) node.parentNode.removeChild(node);
                }, 800);
            })(el);
        }
    }

    /* ---------- 震动反馈 ---------- */
    function vibrate(ms) {
        if (navigator.vibrate) {
            try { navigator.vibrate(ms); } catch (e) { /* 忽略 */ }
        }
    }

    /* ---------- 点击金币 ---------- */
    function handleTap(clientX, clientY) {
        var gain = clickValue();
        state.coins += gain;
        state.totalTaps++;

        // 浮动文字
        spawnFloatText(clientX, clientY, "+" + fmt(gain));
        spawnSparks(clientX, clientY);

        // 金币按压动画
        bigCoin.classList.add("pressed");
        setTimeout(function () { bigCoin.classList.remove("pressed"); }, 100);

        // 计数器弹跳
        coinDisplay.classList.remove("pop");
        void coinDisplay.offsetWidth;
        coinDisplay.classList.add("pop");

        vibrate(12);
        render();
    }

    function onCoinPointer(e) {
        e.preventDefault();
        var rect = bigCoin.getBoundingClientRect();
        var cx = e.clientX !== undefined ? e.clientX : rect.left + rect.width / 2;
        var cy = e.clientY !== undefined ? e.clientY : rect.top + rect.height / 2;
        handleTap(cx, cy);
    }

    bigCoin.addEventListener("pointerdown", onCoinPointer);

    // 点击金币外的 tapArea 也略作引导（不计算收益，仅高亮）
    tapArea.addEventListener("pointerdown", function (e) {
        if (e.target === tapArea) {
            bigCoin.classList.add("shake");
            setTimeout(function () { bigCoin.classList.remove("shake"); }, 360);
        }
    });

    /* ---------- 升级逻辑 ---------- */
    function tryUpgrade(type) {
        window.getSelection && window.getSelection().removeAllRanges();

        if (type === "click") {
            var c = clickCost();
            if (state.coins < c) { denyShake(upgradeClick); return; }
            state.coins -= c;
            state.clickLevel++;
            flash(upgradeClick);
            vibrate(20);
        } else if (type === "auto") {
            var a = autoCost();
            if (state.coins < a) { denyShake(upgradeAuto); return; }
            state.coins -= a;
            state.autoLevel++;
            flash(upgradeAuto);
            vibrate(20);
        } else if (type === "combo") {
            if (state.comboLevel >= COMBO_MAX) { denyShake(upgradeCombo); return; }
            var co = comboCost();
            if (state.coins < co) { denyShake(upgradeCombo); return; }
            state.coins -= co;
            state.comboLevel++;
            flash(upgradeCombo);
            vibrate([20, 40, 20]);
        }
        render();
    }

    function denyShake(el) {
        el.classList.add("shake");
        setTimeout(function () { el.classList.remove("shake"); }, 360);
        vibrate(8);
    }

    function flash(el) {
        el.style.transition = "background 0.1s, box-shadow 0.1s";
        el.style.background = "linear-gradient(135deg, rgba(110,242,184,0.35), rgba(255,255,255,0.05))";
        el.style.boxShadow = "0 0 24px rgba(110,242,184,0.45)";
        setTimeout(function () {
            el.style.background = "";
            el.style.boxShadow = "";
        }, 260);
    }

    upgradeClick.addEventListener("click", function () { tryUpgrade("click"); });
    upgradeAuto.addEventListener("click", function () { tryUpgrade("auto"); });
    upgradeCombo.addEventListener("click", function () { tryUpgrade("combo"); });

    /* ---------- 自动收益 ---------- */
    var lastAutoTick = performance.now();
    function autoTick(now) {
        var dt = (now - lastAutoTick) / 1000;
        lastAutoTick = now;
        if (state.autoLevel > 0) {
            state.coins += cps() * dt;
            render();
        }
        requestAnimationFrame(autoTick);
    }
    requestAnimationFrame(autoTick);

    /* ---------- 重置 ---------- */
    resetBtn.addEventListener("click", function () {
        if (state.totalTaps === 0 && state.coins === 0) {
            // 完全没玩过也允许重置，效果一样
        }
        state.coins = 0;
        state.clickLevel = 1;
        state.autoLevel = 0;
        state.comboLevel = 0;
        state.totalTaps = 0;
        lastAutoTick = performance.now();

        // 给个重置提示
        var rect = resetBtn.getBoundingClientRect();
        spawnFloatText(rect.left + rect.width / 2, rect.top, "已重置");
        vibrate(30);
        render();
    });

    /* ---------- 初始化 ---------- */
    render();
})();

</script>
</body>
</html>
